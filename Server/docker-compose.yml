---

services:
  cg_server_run:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_DOCS: ${BUILD_DOCS:-true}
    container_name: CaptionGlassesServer
    ports:
      - "8080:8080"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PHRASE_TIMEOUT=${PHRASE_TIMEOUT}
      - MAX_DURATION=${MAX_DURATION}
      - VAD_THRESHOLD=${VAD_THRESHOLD}
      - VAD_THRESHOLD_MAX=${VAD_THRESHOLD_MAX:-}
      - ACOUSTIC_VAD_OFFSET_PER_RMS=${ACOUSTIC_VAD_OFFSET_PER_RMS:-}
      - POST_GAIN_LOUD=${POST_GAIN_LOUD:-}
      - SEGMENT_MIN_AVG_LOGPROB_PARTIAL=${SEGMENT_MIN_AVG_LOGPROB_PARTIAL:-}
      - SEGMENT_MIN_AVG_LOGPROB_FINAL=${SEGMENT_MIN_AVG_LOGPROB_FINAL:-}
      - SEGMENT_MAX_NO_SPEECH_PROB_PARTIAL=${SEGMENT_MAX_NO_SPEECH_PROB_PARTIAL:-}
      - SEGMENT_MAX_NO_SPEECH_PROB_FINAL=${SEGMENT_MAX_NO_SPEECH_PROB_FINAL:-}
      - CAPTION_ENV_TELEMETRY=${CAPTION_ENV_TELEMETRY:-}
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    devices:
      - nvidia.com/gpu=${GPU_DEVICE:-0}